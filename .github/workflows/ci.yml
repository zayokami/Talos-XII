name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ─────────────────────────────────────────────────
  #  Check: fast compile check on all platforms
  # ─────────────────────────────────────────────────
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux chart deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo check --verbose

  # ─────────────────────────────────────────────────
  #  Test: run the default test suite on all platforms
  # ─────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux chart deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo test --verbose

  # ─────────────────────────────────────────────────
  #  Clippy: lint on all platforms
  # ─────────────────────────────────────────────────
  clippy:
    name: Clippy (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux chart deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo clippy --all-targets -- -D warnings

  # ─────────────────────────────────────────────────
  #  Format: check code formatting
  # ─────────────────────────────────────────────────
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ─────────────────────────────────────────────────
  #  Release Build: verify optimized builds work
  # ─────────────────────────────────────────────────
  release-build:
    name: Release Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Install Linux chart deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo build --release --verbose
      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: talos_xii-windows
          path: target/release/talos_xii.exe
      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: talos_xii-linux
          path: target/release/talos_xii
      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: talos_xii-macos
          path: target/release/talos_xii

  # ─────────────────────────────────────────────────
  #  Cross-compile: ARM64 Linux
  # ─────────────────────────────────────────────────
  cross-arm64:
    name: Cross (aarch64-linux)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-arm64
      - run: cargo check --target aarch64-unknown-linux-gnu
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          RUST_FONTCONFIG_DLOPEN: on

  # ─────────────────────────────────────────────────
  #  MSRV: verify minimum supported Rust version
  # ─────────────────────────────────────────────────
  msrv:
    name: MSRV (1.89.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Install Linux chart deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo check --verbose
      - run: cargo check --manifest-path bindings/python/Cargo.toml --locked

  # ─────────────────────────────────────────────────
  #  Coverage: code coverage via cargo-llvm-cov
  # ─────────────────────────────────────────────────
  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Install Linux chart deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ─────────────────────────────────────────────────
  #  Cargo package: verify published source contents
  # ─────────────────────────────────────────────────
  package:
    name: Cargo Package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux chart deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo package --locked

  # ─────────────────────────────────────────────────
  #  Python: embedded interpreter and wheel crate
  # ─────────────────────────────────────────────────
  python:
    name: Python Bindings
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: python
      - name: Install Linux chart deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev
      - run: cargo test --features python
      - run: cargo clippy --features python --all-targets -- -D warnings
      - run: cargo check --manifest-path bindings/python/Cargo.toml --locked
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --out dist
      - name: Smoke-test wheel
        run: |
          python -m pip install pytest dist/*.whl
          python -c "import talos_xii as tx; assert tx.__version__; assert tx.ones([2]).to_list() == [1.0, 1.0]"
          python -m pytest bindings/python/tests/test_tensor_contract.py
      - name: PyTorch 2.10 differential contract
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.10,<2.11"
          python -m pytest bindings/python/tests/test_torch_differential.py

  # ─────────────────────────────────────────────────
  #  CUDA compile: toolkit validation without a GPU
  # ─────────────────────────────────────────────────
  cuda-compile:
    name: CUDA 12 Compile
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.8.1-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y curl build-essential pkg-config libfontconfig1-dev libfreetype6-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cuda12-compile
      - run: cargo test --locked --features cuda --no-run
      - run: cargo check --manifest-path bindings/python/Cargo.toml --locked --features cuda

  # ─────────────────────────────────────────────────
  #  CUDA runtime: opt-in self-hosted GPU validation
  # ─────────────────────────────────────────────────
  cuda-gpu:
    name: CUDA GPU Runtime
    if: ${{ vars.TALOS_CUDA_GPU_CI == 'true' }}
    runs-on: [self-hosted, talos-cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked --features cuda -- doctor --json
      - run: cargo test --locked --features cuda gpu_adam -- --test-threads=1
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --locked --features cuda --out dist
      - name: CUDA Python contract
        run: |
          python -m pip install pytest
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl'); assert len(wheels) == 1, wheels; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', wheels[0]])"
          python -m pytest bindings/python/tests/test_cuda_tensor_contract.py
