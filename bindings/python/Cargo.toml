[package]
name = "talos-xii-python"
version = "0.8.0"
edition = "2021"
rust-version = "1.89.0"
description = "Python extension module for the Talos-XII deep-learning framework"
license = "MIT"
repository = "https://github.com/zayokami/Talos-XII"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py39"] }
talos_xii = { path = "../..", default-features = false, features = ["python-bindings"] }

[features]
default = []
cuda = ["talos_xii/cuda"]

[workspace]
